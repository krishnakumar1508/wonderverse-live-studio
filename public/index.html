<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WonderVerse Live Studio</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:20px;background:#101322;color:#fff;font-family:Arial}
main{max-width:650px;margin:20px auto;padding:24px;background:#1d2438;border-radius:16px}
h1{text-align:center;color:#a78bfa}
label{display:block;margin-top:14px;color:#ddd}
input{width:100%;padding:13px;margin-top:6px;background:#101322;color:white;border:1px solid #49516a;border-radius:8px}
button{width:100%;padding:14px;margin-top:16px;border:0;border-radius:8px;background:#7c3aed;color:white;font-weight:bold;font-size:16px;cursor:pointer}
button:disabled{opacity:.5}
.stop{background:#dc2626}
video{width:100%;margin-top:18px;background:#000;border-radius:10px}
#status{margin-top:16px;padding:14px;background:#101322;border-radius:8px;color:#facc15;overflow-wrap:anywhere}
small{color:#aaa}
</style>
</head>
<body>
<main>
<h1>WonderVerse Live Studio</h1>
<p>Computer screen aur system audio ko YouTube aur Facebook par stream karein.</p>

<label>Render Backend URL</label>
<input id="backend" placeholder="https://your-service.onrender.com">

<label>Admin Password</label>
<input id="password" type="password">

<label>YouTube RTMP URL</label>
<input id="ytUrl" placeholder="rtmp://a.rtmp.youtube.com/live2">

<label>YouTube Stream Key</label>
<input id="ytKey" type="password">

<label>Facebook RTMP URL</label>
<input id="fbUrl" placeholder="Facebook ka RTMP server URL">

<label>Facebook Stream Key</label>
<input id="fbKey" type="password">

<button id="save">Save Settings</button>
<button id="start">Share Screen & Start Live</button>
<button id="stop" class="stop" disabled>Stop Live</button>

<video id="preview" autoplay muted playsinline></video>
<div id="status">Status: Ready</div>
<small>Chrome mein screen select karte waqt “Share system audio” option dikhe to use enable karein.</small>
</main>

<script>
const el=id=>document.getElementById(id);
let stream=null,ws=null,recorder=null;

function base(){
  return el("backend").value.trim().replace(/\/+$/,"");
}
function auth(){
  return {Authorization:"Bearer "+el("password").value};
}
function say(message){
  el("status").textContent="Status: "+message;
}

el("save").onclick=async()=>{
  if(!base()||!el("password").value){
    say("Backend URL aur password bhariye.");
    return;
  }

  try{
    const response=await fetch(base()+"/api/screen-config",{
      method:"POST",
      headers:{...auth(),"Content-Type":"application/json"},
      body:JSON.stringify({
        ytUrl:el("ytUrl").value.trim(),
        ytKey:el("ytKey").value.trim(),
        fbUrl:el("fbUrl").value.trim(),
        fbKey:el("fbKey").value.trim()
      })
    });
    const data=await response.json();
    if(!response.ok)throw new Error(data.error||"Settings save nahi hui.");
    say(data.message||"Settings saved.");
  }catch(e){
    say("Error: "+e.message);
  }
};

el("start").onclick=async()=>{
  if(!base()||!el("password").value){
    say("Backend URL aur password bhariye.");
    return;
  }

  try{
    say("Screen permission ka wait...");
    stream=await navigator.mediaDevices.getDisplayMedia({
      video:{frameRate:30},
      audio:true
    });

    el("preview").srcObject=stream;

    const wsBase=base().replace(/^https:/,"wss:").replace(/^http:/,"ws:");
    ws=new WebSocket(wsBase+"/api/screen?token="+encodeURIComponent(el("password").value));

    ws.onopen=()=>{
      const type=MediaRecorder.isTypeSupported("video/webm;codecs=vp8,opus")
        ?"video/webm;codecs=vp8,opus":"video/webm";

      recorder=new MediaRecorder(stream,{mimeType:type});
      recorder.ondataavailable=e=>{
        if(e.data.size&&ws&&ws.readyState===WebSocket.OPEN)ws.send(e.data);
      };
      recorder.start(1000);

      el("start").disabled=true;
      el("stop").disabled=false;
      say("Screen backend se connected. Stream start hone ki jaanch karein.");
    };

    ws.onclose=e=>{
      say("Backend connection band. Code: "+e.code);
      cleanup();
    };
    ws.onerror=()=>say("WebSocket connection error.");
    stream.getVideoTracks()[0].addEventListener("ended",stopLive);

  }catch(e){
    say("Error: "+e.message);
    cleanup();
  }
};

async function stopLive(){
  if(recorder&&recorder.state!=="inactive")recorder.stop();
  if(ws&&ws.readyState<2)ws.close();

  try{
    if(base())await fetch(base()+"/api/stop",{
      method:"POST",
      headers:auth()
    });
  }catch(e){}

  cleanup();
  say("Stream stop request bhej diya.");
}

function cleanup(){
  if(stream)stream.getTracks().forEach(t=>t.stop());
  stream=null;
  ws=null;
  recorder=null;
  el("preview").srcObject=null;
  el("start").disabled=false;
  el("stop").disabled=true;
}

el("stop").onclick=stopLive;
</script>
</body>
</html>
